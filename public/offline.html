<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#D9B66D" />
    <title>Offline — VictoryCity Revival Ministry</title>
    <style>
      :root {
        --navy: #0B1220;
        --navy-2: #172641;
        --gold: #D9B66D;
        --text: #F5F1E8;
        --muted: #B8C0CF;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1f3358 0%, var(--navy) 60%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        text-align: center;
        padding: 40px 32px;
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(23,38,65,0.9), rgba(11,18,32,0.95));
        border: 1px solid rgba(217,182,109,0.25);
        box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      }
      .cross {
        width: 56px; height: 56px; margin: 0 auto 20px;
        color: var(--gold);
      }
      h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: 0.02em; }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; font-size: 15px; }
      button {
        appearance: none;
        border: 1px solid var(--gold);
        background: var(--gold);
        color: var(--navy);
        font-weight: 600;
        font-size: 15px;
        padding: 12px 28px;
        border-radius: 999px;
        cursor: pointer;
        transition: transform .15s ease, box-shadow .15s ease;
      }
      button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(217,182,109,0.35); }
      button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
      .hint { margin-top: 18px; font-size: 13px; color: #8a93a6; }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-labelledby="title">
      <svg class="cross" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M32 8v48M16 24h32" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <h1 id="title">You're offline</h1>
      <p>VictoryCity Revival Ministry can't be reached right now. Please check your connection and try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <p class="hint">Some pages you've visited may still be available.</p>
    </main>
  </body>
</html>
